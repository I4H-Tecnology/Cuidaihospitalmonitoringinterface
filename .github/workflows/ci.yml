name: CI

on:
  push:
    branches: [main, dev, qa]
  pull_request:
    branches: [main, dev, qa]

# Um push novo na mesma branch cancela a execução anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Testes, tipos e build
    runs-on: ubuntu-latest

    # O frontend deixou de morar na raiz. Sem isto, todo passo de npm falha
    # com "package.json not found".
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Rodar testes com cobertura
        run: npm run test:coverage

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: frontend/coverage/
          retention-days: 14

      - name: Build de produção
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

  visao:
    name: Serviço de visão e backend (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: visao/requirements.txt

      # O torch precisa vir do índice CPU: o padrão do PyPI traz CUDA, são
      # gigabytes, e o job estoura o tempo. Instalado ANTES do requirements
      # para o ultralytics não puxar a versão com GPU como dependência.
      - name: Instalar torch (CPU)
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchvision==0.20.1

      - name: Instalar dependências da visão
        run: pip install -r visao/requirements.txt

      # unittest, não pytest: é o que o venv do projeto tem, e é o que roda na
      # máquina do aluno. Um runner diferente no CI mediria outra coisa.
      - name: Testes da visão
        run: python -m unittest discover -s visao/testes -t . -v

      - name: Compilar backend e visão
        run: python -m py_compile backend/app/*.py backend/app/rotas/*.py backend/financeiro/*.py backend/financeiro/*/*.py visao/app/*.py visao/*.py

  # Backend principal (backend/app): token, login, bloqueio, política de senha e
  # permissões. Rodam sem banco: o acesso ao Postgres é trocado por respostas
  # combinadas, então provam a regra e não o SQL (que só um banco de verdade
  # prova, como o job `financeiro` faz com o dele). unittest, como em toda a
  # base: é o que roda na máquina do aluno.
  backend:
    name: Backend principal (testes sem banco)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências do backend
        run: pip install -r backend/requirements.txt

      - name: Testes do backend
        run: python -m unittest discover -s backend/testes -t backend -v

  # Módulo financeiro (backend/financeiro): domínio (imposto, parcela, juros)
  # e integração contra um Postgres de verdade — gatilhos de período fechado,
  # somas conferidas no COMMIT e isolamento entre empresas só existem no banco,
  # então só um banco de verdade prova que funcionam. O banco do serviço é
  # descartável: os testes apagam e recriam o schema `financeiro` nele.
  financeiro:
    name: Módulo financeiro (Python + Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: financeiro
          POSTGRES_PASSWORD: financeiro
          POSTGRES_DB: financeiro_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financeiro -d financeiro_teste"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/financeiro/requirements.txt

      - name: Instalar dependências do módulo
        run: pip install -r backend/financeiro/requirements.txt httpx==0.28.1

      - name: Testes do módulo (domínio e integração)
        env:
          FINANCEIRO_TESTE_DSN: postgresql://financeiro:financeiro@localhost:5432/financeiro_teste
        run: python -m unittest discover -s backend/financeiro/testes -t backend -v

      # O Dockerfile copia arquivos e pastas por nome (nada de `COPY .`). O job
      # `imagem` só roda na main, então sem estes dois passos uma pasta nova do
      # módulo que faltasse no COPY só apareceria depois do merge.
      - name: Construir a imagem do módulo financeiro
        run: docker build -t medsignal-financeiro:${{ github.sha }} ./backend/financeiro

      - name: Conferir que o servidor importa dentro da imagem
        run: >-
          docker run --rm
          -e FINANCEIRO_JWT_SEGREDO=segredo-so-para-o-teste-0123456789abcdef
          -e FINANCEIRO_DATABASE_URL=postgresql://teste@localhost:5432/teste
          medsignal-financeiro:${{ github.sha }}
          python -c "import financeiro.servidor"

  # Análise estática de código e segurança (núcleo comum). Roda dentro do CI,
  # sem serviço externo, conta ou token: o repositório é privado por decisão
  # aprovada com o orientador, e nada aqui depende de visibilidade.
  #
  # O que derruba o job: achado de segurança de severidade alta (Semgrep ERROR,
  # Bandit HIGH), CVE conhecida em dependência pinada (pip-audit) e CVE alta ou
  # crítica no frontend (npm audit). O resto fica visível nos relatórios, que
  # são publicados como artefato de cada execução.
  seguranca:
    name: Análise estática e de segurança
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar ferramentas
        run: pip install --quiet bandit pip-audit semgrep

      - name: Preparar pasta de relatórios
        run: mkdir -p relatorios

      # Regras de segurança para Python e TypeScript, mais detecção de segredos.
      # ERROR derruba; WARNING e INFO ficam no relatório.
      - name: Semgrep
        run: |
          semgrep scan --config p/ci --config p/secrets --metrics=off \
            --exclude node_modules --exclude .venv --exclude dist \
            --exclude frontend/src/app/components/ui --exclude frontend/src/app/components/figma \
            --sarif -o relatorios/semgrep.sarif --error --severity ERROR \
            backend/app backend/financeiro visao/app visao/avaliar.py visao/calibrar.py visao/detectar.py visao/servir.py visao/verificar_camera.py frontend/src
          semgrep scan --config p/ci --config p/secrets --metrics=off --quiet \
            --exclude node_modules --exclude .venv --exclude dist \
            --exclude frontend/src/app/components/ui --exclude frontend/src/app/components/figma \
            --json -o relatorios/semgrep-completo.json \
            backend/app backend/financeiro visao/app visao/avaliar.py visao/calibrar.py visao/detectar.py visao/servir.py visao/verificar_camera.py frontend/src || true

      # Vulnerabilidades em Python. Relatório completo primeiro; depois só a
      # severidade alta decide o resultado.
      - name: Bandit
        run: |
          bandit -q -r backend/app backend/financeiro visao/app visao/avaliar.py visao/calibrar.py visao/detectar.py visao/servir.py visao/verificar_camera.py -f json -o relatorios/bandit.json || true
          bandit -q -r backend/app backend/financeiro visao/app visao/avaliar.py visao/calibrar.py visao/detectar.py visao/servir.py visao/verificar_camera.py -lll

      # CVE conhecida nas dependências pinadas. --no-deps audita o que está no
      # arquivo; a resolução completa baixaria o torch com CUDA.
      - name: pip-audit
        run: |
          pip-audit -r backend/requirements.txt --no-deps --desc -f json -o relatorios/pip-audit-backend.json
          pip-audit -r backend/financeiro/requirements.txt --no-deps --desc -f json -o relatorios/pip-audit-financeiro.json
          # PYSEC-2026-1805 (protobuf 4.25): a correção está na série 5.x, e o
          # mediapipe 0.10.20 exige protobuf < 5. Fica ignorada com registro
          # até o mediapipe ser atualizado; qualquer CVE nova continua derrubando.
          pip-audit -r visao/requirements.txt --no-deps --desc -f json -o relatorios/pip-audit-visao.json --ignore-vuln PYSEC-2026-1805

      # CVE nas dependências do frontend. Alta ou crítica derruba.
      - name: npm audit
        working-directory: frontend
        run: |
          npm audit --json > ../relatorios/npm-audit.json || true
          npm audit --audit-level=high

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analise-de-seguranca
          path: relatorios/
          retention-days: 30

  imagem:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: [qualidade, visao, backend, financeiro, seguranca]
    # Sem working-directory aqui: os contextos de build sao passados explicitos.
    # Só valida a imagem no que vai para produção.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem do frontend
        run: docker build -t medsignal-frontend:${{ github.sha }} ./frontend

      - name: Build da imagem do backend
        run: docker build -t medsignal-backend:${{ github.sha }} ./backend
