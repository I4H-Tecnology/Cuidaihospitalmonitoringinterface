server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # A página de entrada é sempre revalidada: depois de uma publicação, o
  # navegador busca a versão nova em vez de reaproveitar a antiga (26/11/2026:
  # uma aba recarregada normalmente continuou mostrando a tela já retirada).
  # Revalidar não é baixar de novo: sem mudança, a resposta é 304.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # Arquivos do build com hash no nome: o nome muda a cada build, então podem
  # ficar no cache por um ano. Arquivo que não existe é 404, e não a página
  # inicial servida como se fosse JavaScript.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    # SPA fallback for client-side routes (cai em /index.html, acima).
    try_files $uri $uri/ /index.html;
  }
}
