# =============================================================================
#  MedSignal — ambiente local completo
#
#    docker compose run --rm dev       # dia a dia: db + api, com aviso de
#                                       # pronto no terminal
#    docker compose up -d              # a mesma coisa, sem o aviso
#    cd frontend && npm run dev        # frontend dev, direto no Windows
#    docker compose up -d adminer      # cliente web do banco, à parte (opcional)
#    docker compose --profile prod up        # testa a imagem de produção (nginx)
#    docker compose up -d sonarqube          # análise de qualidade (SonarQube), à parte
#    docker compose run --rm sonar-scanner   # envia o código para o SonarQube
#
#  Portas:  5173 frontend dev · 8080 frontend prod · 8000 API · 5432 db · 8081 Adminer
#           8888 Dozzle (logs ao vivo) · 9000 SonarQube
#
#  A câmera não sobe por aqui: container no Windows não enxerga webcam. Ver
#  `visao/servir.py`, fora do Docker.
# =============================================================================

name: medsignal

services:
  # ---------------------------------------------------------------------------
  # Banco de dados — as 12 entidades do DER da RFC vivem aqui.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: medsignal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medsignal}
      POSTGRES_USER: ${POSTGRES_USER:-medsignal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      # Locale pt-BR para ordenação e mensagens coerentes com o domínio.
      LANG: pt_BR.utf8
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts rodam UMA vez, na criação do volume. Para reexecutar:
      #   docker compose down -v && docker compose up -d
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # Scripts avulsos, rodados sob demanda com psql -f /scripts/<arquivo>.sql
      - ./db/scripts:/scripts:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-medsignal} -d ${POSTGRES_DB:-medsignal}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Cliente web de banco — para inspecionar as tabelas sem instalar nada.
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:5
    container_name: medsignal-adminer
    restart: unless-stopped
    ports:
      - '${ADMINER_PORT:-8081}:8080'
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Monitoramento — logs ao vivo e consumo de CPU/memória de cada contêiner,
  # no navegador: http://localhost:8888. Sobe junto com o resto (sem profile).
  #
  # Mostra os contêineres do Docker; o serviço de visão com webcam roda nativo
  # no Windows (ver o aviso no topo) e por isso NÃO aparece aqui: o log dele
  # fica no terminal em que `visao/servir.py` foi iniciado.
  #
  # O socket do Docker dá ao Dozzle acesso de leitura a tudo o que roda na
  # máquina, e os logs podem conter dados de paciente (LGPD). Por isso a porta
  # só abre em 127.0.0.1. Em servidor, ponha autenticação do Dozzle antes de
  # expor (DOZZLE_AUTH_PROVIDER=simple) em vez de abrir a porta para a rede.
  # ---------------------------------------------------------------------------
  dozzle:
    image: amir20/dozzle:v11.4.3
    container_name: medsignal-dozzle
    restart: unless-stopped
    ports:
      - '127.0.0.1:${DOZZLE_PORT:-8888}:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_NO_ANALYTICS: 'true'
    healthcheck:
      test: ['CMD', '/dozzle', 'healthcheck']
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Frontend em desenvolvimento DENTRO do Docker — opcional, fora da subida
  # padrão. No dia a dia o Vite roda direto no Windows (`npm run dev` em
  # frontend/, ver README): lendo o código por esta pasta montada, cada arquivo
  # levava de 10 a 21 s para abrir na primeira vez, contra 0,1 s nativo, e as
  # telas abertas pela primeira vez demoravam isso. Continua aqui para quem
  # está em Linux ou com o projeto dentro do WSL2, onde a montagem é rápida:
  #   docker compose --profile frontend-docker up -d frontend-dev
  # node_modules fica no volume do container para não brigar com o do Windows.
  # ---------------------------------------------------------------------------
  frontend-dev:
    profiles: ['frontend-docker']
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: medsignal-frontend-dev
    restart: unless-stopped
    ports:
      - '${FRONTEND_DEV_PORT:-5173}:5173'
    environment:
      # No navegador do host, a API é localhost — não o hostname da rede Docker.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      # Servico de visao. Roda fora do compose quando a fonte e webcam, porque
      # container no Windows nao enxerga dispositivo de video.
      VITE_VISAO_URL: ${VITE_VISAO_URL:-http://localhost:8001}
      # Necessário para o HMR enxergar alterações vindas de um bind mount Windows.
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # ---------------------------------------------------------------------------
  # Frontend de produção — a mesma imagem que vai para o Hetzner.
  #   docker compose --profile prod up --build frontend
  # ---------------------------------------------------------------------------
  frontend:
    profiles: ['prod']
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_MODE: production
    container_name: medsignal-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-8080}:80'

  # ---------------------------------------------------------------------------
  # Backend — API do produto (FastAPI), mora em backend/. Sem profile: sobe
  # junto por padrão, porque não há mais uso real do frontend sem ele (login,
  # pacientes, ocorrências, alertas, tudo passa por aqui). Era opcional
  # (`--profile api`) de quando ainda era só um andaime para destravar o
  # login; o comando antigo continua funcionando, só que agora não muda nada.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medsignal-api
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medsignal}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medsignal}
      CORS_ORIGINS: http://localhost:${FRONTEND_DEV_PORT:-5173},http://localhost:${FRONTEND_PORT:-8080}
      # Assina os tokens. Sem valor padrao de proposito: chave com padrao e
      # chave publicada, e qualquer um forjaria um token valido.
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      TOKEN_HORAS: ${TOKEN_HORAS:-8}
      # "dev" devolve o codigo de recuperacao de senha na resposta da API
      # (nao ha envio de e-mail). Qualquer outro valor, inclusive vazio, nao devolve.
      MEDSIGNAL_AMBIENTE: ${MEDSIGNAL_AMBIENTE:-producao}
      # O painel mostra a faixa "MODO DE TESTE" a partir do que o BACKEND diz (GET /api/modo-de-teste),
      # então o backend precisa receber a mesma flag do .env que o serviço de visão lê.
      MEDSIGNAL_MODO_TESTE: ${MEDSIGNAL_MODO_TESTE:-false}
      # Log estruturado (json|texto) e nivel, iguais aos do servico de visao.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMATO: ${LOG_FORMATO:-json}
      # Clipes de evidencia gravados pelo servico de visao. A API so serve e
      # expurga; a pasta e a mesma do host, montada abaixo.
      CLIPES_DIR: /app/dados/clipes
      # Prazo do expurgo, em horas: 24 pela RFC; ate 720 (30 dias) so em modo
      # de teste. Tem de ser o mesmo VISAO_CLIPES_RETENCAO_HORAS do servico de
      # visao, porque os dois apagam a mesma pasta.
      CLIPES_RETENCAO_HORAS: ${CLIPES_RETENCAO_HORAS:-24}
      # Fuso do "hoje" do módulo financeiro (vencido, vence hoje).
      FINANCEIRO_FUSO: ${FINANCEIRO_FUSO:-America/Sao_Paulo}
      # Portal da família: a API repassa o vídeo da câmera do paciente, então
      # precisa enxergar o serviço de visão. Com webcam ele roda no host, fora
      # do Docker; daqui o host é host.docker.internal, não localhost.
      VISAO_URL_PADRAO: ${VISAO_URL_PADRAO:-http://host.docker.internal:8001}
      VISAO_HOST_LOCAL: ${VISAO_HOST_LOCAL:-host.docker.internal}
    extra_hosts:
      # No Docker Desktop o nome já existe; no Linux, esta linha o cria.
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./visao/dados/clipes:/app/dados/clipes
    healthcheck:
      # A imagem python:slim nao tem curl; o proprio Python faz o GET.
      test: ['CMD', 'python', '-c', "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # API FastAPI definitiva de outro repositório — alternativa ao serviço acima.
  # Os dois publicam a porta 8000: pare o padrão antes de subir este
  # (`docker compose stop backend`), senão a porta já está em uso.
  #
  # Clone o backend em ../medsignal-backend e rode:
  #   docker compose --profile externo up -d --build backend-externo
  #
  # Se o caminho for outro, ajuste BACKEND_PATH no .env.
  # ---------------------------------------------------------------------------
  backend-externo:
    profiles: ['externo']
    build:
      context: ${BACKEND_PATH:-../medsignal-backend}
      dockerfile: Dockerfile
    container_name: medsignal-api-externa
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    environment:
      # Dentro da rede do compose o host do banco é o nome do serviço: "db".
      DATABASE_URL: postgresql://${POSTGRES_USER:-medsignal}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medsignal}
      # A API precisa liberar CORS para as duas portas do frontend.
      CORS_ORIGINS: http://localhost:${FRONTEND_DEV_PORT:-5173},http://localhost:${FRONTEND_PORT:-8080}
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Módulo financeiro como SERVIÇO PRÓPRIO — opcional. O MedSignal usa o módulo
  # embutido na API acima; este serviço existe para o outro jeito de reusar o
  # módulo: um sistema que não é Python (Laravel, Node) falando com ele por
  # HTTP, com um JWT assinado pelo segredo compartilhado.
  #   docker compose --profile financeiro-servico up -d --build financeiro
  # Divide o banco com a API sem conflito: o schema é o mesmo (`financeiro`) e
  # cada sistema enxerga só as empresas dele.
  # ---------------------------------------------------------------------------
  financeiro:
    profiles: ['financeiro-servico']
    build:
      context: ./backend/financeiro
      dockerfile: Dockerfile
    container_name: medsignal-financeiro
    restart: unless-stopped
    ports:
      - '${FINANCEIRO_PORT:-8100}:8100'
    environment:
      FINANCEIRO_DATABASE_URL: postgresql://${POSTGRES_USER:-medsignal}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medsignal}
      # Sem padrão de propósito: vazio, o serviço recusa subir (servidor.py).
      FINANCEIRO_JWT_SEGREDO: ${FINANCEIRO_JWT_SEGREDO:-}
      FINANCEIRO_CORS: http://localhost:${FRONTEND_DEV_PORT:-5173}
      FINANCEIRO_FUSO: ${FINANCEIRO_FUSO:-America/Sao_Paulo}
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Análise de qualidade — SonarQube Community, à parte do dia a dia: pede ~2 GB
  # de RAM e uns 2 min para subir. Roteiro, na primeira vez:
  #
  #   1. docker compose up -d sonarqube          (espere o http://localhost:9000)
  #   2. entre com admin / admin; ele pede para trocar a senha
  #   3. Minha conta > Segurança > gere um token e ponha SONAR_TOKEN no .env
  #   4. cd frontend && npx vitest run --coverage --coverage.thresholds.autoUpdate=false
  #   5. node scripts/sonar-cobertura.mjs        (ajusta os caminhos do lcov)
  #   6. docker compose run --rm sonar-scanner   (o resultado aparece em :9000)
  #
  # O CI não envia nada para cá: o servidor mora na sua máquina e o repositório
  # é privado (o SonarCloud gratuito exige repositório público). A análise
  # estática e de segurança do pipeline continua sendo o job `seguranca`.
  #
  # Banco do próprio Sonar: PostgreSQL à parte, sem porta publicada. O banco
  # embutido (H2) é vedado pelas directions e o do MedSignal não deve receber
  # tabelas de uma ferramenta.
  # ---------------------------------------------------------------------------
  sonar-db:
    profiles: ['qualidade']
    image: postgres:16-alpine
    container_name: medsignal-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      # Só existe dentro da rede do compose; vale o padrão, o .env pode trocar.
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sonar -d sonar']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  sonarqube:
    profiles: ['qualidade']
    image: sonarqube:26.11.0.134175-community
    container_name: medsignal-sonarqube
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${SONAR_PORT:-9000}:9000'
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      # O Elasticsearch embutido exige vm.max_map_count >= 262144 no Linux do
      # Docker. Sem isto, se a máquina não tiver, o contêiner sai na subida.
      SONAR_SEARCH_JAVAADDITIONALOPTS: -Dnode.store.allow_mmap=false
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:9000/api/system/status | grep -q "\"status\":\"UP\""']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  # O scanner é de execução única: `run --rm`, nunca `up`. Lê o repositório
  # montado só para leitura e escreve o que precisa em /tmp (ver
  # sonar.working.directory em sonar-project.properties). O que analisar, o que
  # ignorar e onde está a cobertura vem do sonar-project.properties, na raiz.
  sonar-scanner:
    profiles: ['sonar-scan']
    image: sonarsource/sonar-scanner-cli:12.4.0.4321_8.4.0
    container_name: medsignal-sonar-scanner
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      # Vazio, o servidor responde "Not authorized"; ver o roteiro acima.
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    # Não monte o repositório inteiro. O sensor de Python percorre a árvore a
    # partir da raiz do projeto (/usr/src) atrás de arquivos de build
    # (PackageRootResolver.findBuildConfigFiles) e essa varredura não respeita
    # `exclusions`. Medido num bind mount do Windows: uma passada por
    # frontend/node_modules (68 mil arquivos) leva ~170 s e por visao/.venv
    # (36 mil) ~120 s; com as duas dentro de /usr/src o sensor de Python passou
    # de 9 minutos (a análise foi interrompida; o dump de threads mostrava a
    # varredura). Monte só o que está em sonar.sources, sonar.tests e no
    # relatório de cobertura; pasta nova no sonar-project.properties entra aqui.
    #
    # node_modules vai para /node_modules, FORA de /usr/src: o TypeScript o acha
    # subindo as pastas, e os tipos das bibliotecas resolvem (a documentação do
    # SonarQube recomenda as dependências instaladas) sem o sensor de Python
    # vê-lo (~12 s). Rode `npm ci` em frontend/ antes; sem ele a pasta fica
    # vazia e a análise volta a ficar sem os tipos das bibliotecas.
    volumes:
      - ./sonar-project.properties:/usr/src/sonar-project.properties:ro
      - ./backend:/usr/src/backend:ro
      - ./visao/app:/usr/src/visao/app:ro
      - ./visao/testes:/usr/src/visao/testes:ro
      - ./visao/avaliar.py:/usr/src/visao/avaliar.py:ro
      - ./visao/calibrar.py:/usr/src/visao/calibrar.py:ro
      - ./visao/detectar.py:/usr/src/visao/detectar.py:ro
      - ./visao/preparar_urfall.py:/usr/src/visao/preparar_urfall.py:ro
      - ./visao/servir.py:/usr/src/visao/servir.py:ro
      - ./visao/verificar_camera.py:/usr/src/visao/verificar_camera.py:ro
      - ./frontend/src:/usr/src/frontend/src:ro
      - ./frontend/tsconfig.json:/usr/src/frontend/tsconfig.json:ro
      - ./frontend/node_modules:/node_modules:ro
      - ./frontend/coverage:/usr/src/frontend/coverage:ro

  # ---------------------------------------------------------------------------
  # Atalho do dia a dia: `docker compose run --rm dev` sobe db + backend (na
  # ordem certa, esperando o banco ficar saudável) e mostra os endereços no
  # terminal. O frontend roda fora daqui, com `npm run dev` em frontend/.
  # Ctrl+C só fecha este aviso — os serviços continuam no ar;
  # `docker compose down` para desligar de verdade.
  # Não é um serviço de verdade: é o alpine parado, só para dar nome ao grupo.
  # ---------------------------------------------------------------------------
  dev:
    image: alpine:3.20
    command: >
      sh -c "
      echo '' &&
      echo 'MedSignal no ar:' &&
      echo '  API        http://localhost:8000/docs' &&
      echo '  Banco      localhost:5432' &&
      echo '  Logs       http://localhost:8888  (Dozzle)' &&
      echo '' &&
      echo 'Frontend: em outro terminal, cd frontend && npm run dev  (http://localhost:5173)' &&
      echo '' &&
      echo 'Adminer (cliente do banco, opcional): docker compose up -d adminer' &&
      echo 'Ctrl+C sai deste aviso sem derrubar nada. Para desligar: docker compose down' &&
      sleep infinity
      "
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
      # Para os logs já estarem no ar quando o aviso aparece.
      dozzle:
        condition: service_started

volumes:
  pgdata:
    name: medsignal-pgdata
  sonar-db-data:
    name: medsignal-sonar-db
  sonar-data:
    name: medsignal-sonar-data
  sonar-extensions:
    name: medsignal-sonar-extensions
  sonar-logs:
    name: medsignal-sonar-logs
