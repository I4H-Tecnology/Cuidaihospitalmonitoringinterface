# =============================================================================
#  MedSignal — configuração da análise no SonarQube.
#  Roteiro de uso: comentário do serviço `sonarqube` em docker-compose.yml.
#      docker compose run --rm sonar-scanner
#  O scanner roda dentro do contêiner, com o repositório montado em /usr/src
#  (somente leitura): todo caminho abaixo é relativo à raiz do repositório.
# =============================================================================

sonar.projectKey=medsignal
sonar.projectName=MedSignal
sonar.sourceEncoding=UTF-8

# O contêiner monta o repositório só para leitura. Sem isto o scanner tenta
# criar a pasta .scannerwork dentro dele e falha.
sonar.working.directory=/tmp/.scannerwork

# Histórico do Git (blame) não é necessário e, num diretório montado, o Git
# reclama de "dubious ownership".
sonar.scm.disabled=true

# --- O que analisar -----------------------------------------------------------
# Mesma lista de fontes do job `seguranca` em .github/workflows/ci.yml.
sonar.sources=\
  backend/app,\
  backend/financeiro,\
  visao/app,\
  visao/avaliar.py,\
  visao/calibrar.py,\
  visao/detectar.py,\
  visao/preparar_urfall.py,\
  visao/servir.py,\
  visao/verificar_camera.py,\
  frontend/src

# Testes ficam fora das fontes: o Sonar recusa o mesmo arquivo nos dois lados,
# então `exclusions` e `test.inclusions` precisam ser conjuntos disjuntos.
sonar.tests=\
  backend/testes,\
  backend/financeiro/testes,\
  visao/testes,\
  frontend/src
sonar.test.inclusions=\
  backend/testes/**,\
  backend/financeiro/testes/**,\
  visao/testes/**,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.test.tsx

# `ui` é shadcn e `figma` é exportado: código de terceiro, fora da análise, como
# já está no Semgrep do CI. (Confirmar com o professor; ver vite.config.ts.)
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/__pycache__/**,\
  backend/financeiro/testes/**,\
  visao/testes/**,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.test.tsx,\
  frontend/src/app/components/ui/**,\
  frontend/src/app/components/figma/**

sonar.python.version=3.12

# --- TypeScript ---------------------------------------------------------------
# Sem esta linha o scanner procura tsconfig.json percorrendo a árvore inteira e,
# não achando (o contêiner só monta as pastas do projeto), monta um temporário
# com opções padrão ("Analyzing N file(s) using default options"). Fonte:
# docs.sonarsource.com > JavaScript/TypeScript/CSS. A documentação também
# recomenda as dependências instaladas: sem elas os tipos das bibliotecas não
# resolvem e regras que dependem de tipo deixam de enxergar muita coisa (a
# S9383, de promises sem tratamento, foi de 17 para 111 achados no código
# original quando os tipos passaram a resolver). Por isso o contêiner monta
# frontend/node_modules em /node_modules, fora da raiz do projeto (ver o
# comentário do serviço sonar-scanner em docker-compose.yml).
sonar.typescript.tsconfigPaths=frontend/tsconfig.json

# --- Quality Gate -------------------------------------------------------------
# O scanner espera o servidor processar o relatório e sai com erro se o gate
# falhar (sonar.qualitygate.wait: "força o pipeline a falhar se o gate falhar").
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# --- Cobertura ----------------------------------------------------------------
# Só do frontend (Vitest). Os testes de Python são unittest e o projeto não roda
# coverage.py, então o Sonar analisa o Python sem percentual de cobertura.
# O lcov-sonar.info é gerado por `node scripts/sonar-cobertura.mjs`, que ajusta
# os caminhos do lcov.info do Vitest para a raiz do repositório.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov-sonar.info
